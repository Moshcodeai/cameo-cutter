<title>Cameo Cutter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#f3f4f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0c12" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one phone column of soft cards — a green cutting mat as the hero, settings below, a floating Cut bar */
:root {
  --bg: #f3f4f8;
  --card: #ffffff;
  --field: #f1f2f7;
  --ink: #0d1020;
  --muted: #6b7088;
  --line: #e6e8f0;
  --accent: #3346ff;          /* cobalt */
  --accent-ink: #ffffff;
  --accent-soft: #e9ebff;
  --mat: #1d5a4b;             /* self-healing cutting mat */
  --mat-edge: #16483c;
  --mat-grid: rgba(255, 255, 255, .16);
  --mat-ruler: rgba(255, 255, 255, .62);
  --cutline: #ffd84a;
  --ok: #0f9d68;
  --warn: #b86a00;
  --bad: #e5484d;
  --shadow: 0 1px 2px rgba(13, 16, 32, .04), 0 10px 30px rgba(13, 16, 32, .07);
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-lg: 24px;
  --r-md: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0c12; --card: #151722; --field: #1d2030; --ink: #eef0f8; --muted: #8d92aa; --line: #262a3b;
    --accent: #7080ff; --accent-ink: #0b0c12; --accent-soft: #23284a; --mat: #15463a; --mat-edge: #0f362c;
    --ok: #38c98f; --warn: #e9a23b; --bad: #ff6b70; --shadow: 0 0 0 1px #20243a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0c12; --card: #151722; --field: #1d2030; --ink: #eef0f8; --muted: #8d92aa; --line: #262a3b;
  --accent: #7080ff; --accent-ink: #0b0c12; --accent-soft: #23284a; --mat: #15463a; --mat-edge: #0f362c;
  --ok: #38c98f; --warn: #e9a23b; --bad: #ff6b70; --shadow: 0 0 0 1px #20243a;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--ink); font: 500 15px/1.45 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 150px; }

/* header */
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; align-items: center; gap: 12px; padding-block: 16px 6px; }
.brand { font: 800 30px/1 var(--display); letter-spacing: -.03em; }
.conn { flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: var(--muted); }
.conn span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); opacity: .45; flex: none; }
.dot.on { background: var(--ok); opacity: 1; box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 18%, transparent); }
.dot.busy { background: var(--warn); opacity: 1; }

/* buttons: one shape, filled or soft */
button { font: 700 14px/1 var(--body); border: 0; border-radius: var(--r-md); padding: 13px 18px; cursor: pointer;
  background: var(--accent-soft); color: var(--accent); transition: transform .12s, filter .12s; }
button.primary { background: var(--accent); color: var(--accent-ink); }
button:active:not(:disabled) { transform: scale(.97); }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.link { background: none; padding: 6px 0; color: var(--accent); font-weight: 700; }

/* cards */
.card { background: var(--card); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 18px; display: grid; gap: 16px; min-width: 0; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h2 { margin: 0; font: 700 19px/1.1 var(--display); letter-spacing: -.01em; }
.sub { font-size: 13px; color: var(--muted); }

/* underlined tabs */
.tabs { display: flex; gap: 20px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); margin-inline: -2px; padding-inline: 2px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; background: none; border-radius: 0; padding: 10px 0 11px; font: 700 15px/1 var(--body); color: var(--muted); position: relative; }
.tab::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: transparent; }
.tab[aria-selected="true"] { color: var(--ink); }
.tab[aria-selected="true"]::after { background: var(--accent); }
.tab:active { transform: none; }

.note { font-size: 13px; color: var(--muted); margin: 0; }
.note.bad { color: var(--bad); }

/* the mat */
.mat svg { display: block; width: 100%; height: auto; max-width: 100%; }
.mat .bed { fill: var(--mat); }
.mat .edge { fill: none; stroke: var(--mat-edge); stroke-width: 1.2; }
.mat .grid { stroke: var(--mat-grid); stroke-width: .35; }
.mat .grid.major { stroke-width: .6; }
.mat .ruler { fill: var(--mat-ruler); font: 700 6.5px var(--body); }
.mat .empty { fill: var(--mat-ruler); font: 600 9px var(--body); }
.mat .cut { fill: none; stroke: var(--cutline); stroke-width: .8; stroke-linejoin: round; stroke-linecap: round; }
.mat .start { fill: var(--cutline); }
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meta b { color: var(--ink); font-weight: 700; }
.warns { display: grid; gap: 4px; }
.warns:empty { display: none; }
.warns p { margin: 0; font-size: 13px; color: var(--warn); font-weight: 600; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
input[type=file] { display: none; }

/* fields */
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px; }
.field { display: grid; gap: 7px; min-width: 0; }
.field label { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .01em; }
.val { display: flex; align-items: center; gap: 4px; background: var(--field); border-radius: var(--r-md); padding: 4px; min-height: 48px; }
.val input, .val select { flex: 1; width: 100%; min-width: 0; border: 0; background: transparent; color: var(--ink);
  font: 800 17px var(--body); padding: 8px 8px; font-variant-numeric: tabular-nums; }
.val select { font-weight: 700; font-size: 15px; }
.val .unit { padding-right: 10px; font-size: 12px; font-weight: 700; color: var(--muted); }
.step { flex: none; width: 40px; height: 40px; padding: 0; border-radius: 11px; background: var(--card); color: var(--ink);
  font: 700 20px/1 var(--body); box-shadow: 0 1px 2px rgba(13, 16, 32, .08); }
.field.changed .val { box-shadow: inset 0 0 0 2px var(--accent); }

/* standard bar */
.std { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 16px; padding: 12px 14px; border-radius: var(--r-md); background: var(--field); }
.std .txt { flex: 1 1 180px; min-width: 0; font-size: 13px; font-weight: 600; color: var(--muted); }
.std .txt b { color: var(--ink); }
.std.dirty { background: var(--accent-soft); }
.std .btns { display: flex; gap: 16px; }

details { padding: 4px 4px 0; }
summary { cursor: pointer; font-size: 13px; font-weight: 700; color: var(--muted); }
pre.log { margin: 10px 0 0; max-height: 240px; overflow: auto; font: 12px/1.5 ui-monospace, "SFMono-Regular", Menlo, monospace; color: var(--muted);
  white-space: pre-wrap; word-break: break-word; background: var(--card); border-radius: var(--r-md); padding: 12px; }

/* floating cut bar */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; pointer-events: none;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
.dock .inner { pointer-events: auto; max-width: 560px; margin: 0 auto; display: grid; gap: 10px; padding: 12px 12px 12px 18px;
  border-radius: var(--r-lg); background: color-mix(in srgb, var(--card) 88%, transparent);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  box-shadow: 0 0 0 1px var(--line), 0 18px 40px rgba(13, 16, 32, .16); }
.dock .row { display: flex; gap: 12px; align-items: center; }
.dock .msg { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; color: var(--muted); }
.dock .msg.bad { color: var(--bad); }
.dock .msg.good { color: var(--ok); }
.dock button.primary { min-width: 128px; padding: 17px 26px; font: 800 17px/1 var(--display); letter-spacing: .01em; border-radius: 18px; }
.bar { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar[hidden] { display: none; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 4px; transition: width .25s; }
@media (prefers-reduced-motion: reduce) { .bar i, button { transition: none; } }
</style>

<div class="wrap">
  <header>
    <div class="brand">Cutter</div>
    <div class="conn"><span class="dot" id="dot"></span><span id="connText">Not connected</span></div>
    <button id="connectBtn" type="button" class="primary">Connect</button>
  </header>

  <div class="card" id="connectRow">
    <div class="tabs" role="tablist" aria-label="Connect by">
      <button class="tab" role="tab" id="viaBle" aria-selected="true" type="button">Bluetooth</button>
      <button class="tab" role="tab" id="viaUsb" aria-selected="false" type="button">USB cable</button>
    </div>
    <p class="note" id="connNote">Turn the Cameo on and close Silhouette Studio or Silhouette Go on any device, then tap Connect.</p>
  </div>

  <section class="card" aria-labelledby="hMat">
    <div class="card-head"><h2 id="hMat">On the mat</h2><span class="sub" id="matName"></span></div>
    <div class="mat"><svg id="matSvg" viewBox="0 0 304.8 304.8" role="img" aria-label="Cutting mat preview"></svg></div>
    <div class="meta" id="meta"></div>
    <div class="warns" id="warns"></div>
    <div class="fields">
      <div class="field"><label for="posX">From left edge</label>
        <div class="val"><input id="posX" type="number" inputmode="decimal" step="1" min="0"><span class="unit">mm</span></div></div>
      <div class="field"><label for="posY">From top edge</label>
        <div class="val"><input id="posY" type="number" inputmode="decimal" step="1" min="0"><span class="unit">mm</span></div></div>
    </div>
    <div class="actions">
      <button type="button" id="openBtn">Open SVG</button>
      <button type="button" id="testBtn">Test square</button>
      <input type="file" id="file" accept=".svg,image/svg+xml">
    </div>
  </section>

  <section class="card" aria-labelledby="hMaterial">
    <div class="card-head"><h2 id="hMaterial">Settings</h2></div>
    <div class="tabs" role="tablist" aria-label="Material" id="presetTabs"></div>
    <div class="std" id="std"></div>
    <div class="fields">
      <div class="field" data-f="tool"><label for="tool">Tool</label>
        <div class="val"><select id="tool"><option value="autoblade">AutoBlade</option><option value="blade">Ratchet blade</option><option value="pen">Pen</option></select></div></div>
      <div class="field" data-f="holder"><label for="holder">Holder</label>
        <div class="val"><select id="holder"><option value="1">Left (1)</option><option value="2">Right (2)</option></select></div></div>
      <div class="field" data-f="depth" id="depthField"><label for="depth">Blade depth</label>
        <div class="val"><input id="depth" type="number" inputmode="numeric" min="0" max="10"><button class="step" type="button" data-step="depth,-1" aria-label="Less depth">−</button><button class="step" type="button" data-step="depth,1" aria-label="More depth">+</button></div></div>
      <div class="field" data-f="force"><label for="force">Force</label>
        <div class="val"><input id="force" type="number" inputmode="numeric" min="1" max="33"><button class="step" type="button" data-step="force,-1" aria-label="Less force">−</button><button class="step" type="button" data-step="force,1" aria-label="More force">+</button></div></div>
      <div class="field" data-f="speed"><label for="speed">Speed</label>
        <div class="val"><input id="speed" type="number" inputmode="numeric" min="1" max="30"><button class="step" type="button" data-step="speed,-1" aria-label="Slower">−</button><button class="step" type="button" data-step="speed,1" aria-label="Faster">+</button></div></div>
      <div class="field" data-f="passes"><label for="passes">Passes</label>
        <div class="val"><input id="passes" type="number" inputmode="numeric" min="1" max="5"><button class="step" type="button" data-step="passes,-1" aria-label="Fewer passes">−</button><button class="step" type="button" data-step="passes,1" aria-label="More passes">+</button></div></div>
      <div class="field" data-f="mat"><label for="mat">Mat</label>
        <div class="val"><select id="mat"><option value="cameo_12x12">12 × 12 in</option><option value="cameo_12x24">12 × 24 in</option><option value="no_mat">No mat (roll)</option></select></div></div>
    </div>
  </section>

  <details>
    <summary>Details</summary>
    <pre class="log" id="log"></pre>
  </details>
</div>

<div class="dock">
  <div class="inner">
    <div class="bar" id="bar" aria-hidden="true" hidden><i id="barFill"></i></div>
    <div class="row">
      <div class="msg" id="dockMsg">Load a design to start</div>
      <button class="primary" type="button" id="cutBtn" disabled>Cut</button>
    </div>
  </div>
</div>

<script type="module">
/*CORE*/

// ------------------------------------------------------------- state
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const FIELDS = ['tool', 'holder', 'depth', 'force', 'speed', 'passes', 'mat'];
const LABEL = { tool: 'Tool', holder: 'Holder', depth: 'Blade depth', force: 'Force', speed: 'Speed', passes: 'Passes', mat: 'Mat' };
const SHOW = {
  tool: (v) => ({ autoblade: 'AutoBlade', blade: 'Ratchet blade', pen: 'Pen' }[v]),
  holder: (v) => (v == 1 ? 'Left' : 'Right'),
  mat: (v) => ({ cameo_12x12: '12×12', cameo_12x24: '12×24', no_mat: 'No mat' }[v]),
};
const show = (f, v) => (SHOW[f] ? SHOW[f](v) : String(v));
// Bookbinding numbers are placeholders until Moishi saves his own (confirmed: false).
const DEFAULTS = [
  { id: 'bookbinding', name: 'Bookbinding', tool: 'autoblade', holder: 1, depth: 5, force: 30, speed: 3, passes: 2, mat: 'cameo_12x12', confirmed: false },
  { id: 'paper', name: 'Copy paper', tool: 'autoblade', holder: 1, depth: 1, force: 10, speed: 5, passes: 1, mat: 'cameo_12x12' },
  { id: 'card', name: 'Cardstock', tool: 'autoblade', holder: 1, depth: 4, force: 26, speed: 5, passes: 1, mat: 'cameo_12x12' },
  { id: 'vinyl', name: 'Vinyl', tool: 'autoblade', holder: 1, depth: 1, force: 10, speed: 5, passes: 1, mat: 'cameo_12x12' },
  { id: 'sticker', name: 'Sticker paper', tool: 'autoblade', holder: 1, depth: 2, force: 15, speed: 5, passes: 1, mat: 'cameo_12x12' },
  { id: 'pen', name: 'Pen', tool: 'pen', holder: 2, depth: 0, force: 10, speed: 8, passes: 1, mat: 'cameo_12x12' },
];
const STD_KEY = 'cutter.standards.v2';
let standards = store.get(STD_KEY, null);
if (!Array.isArray(standards)) standards = DEFAULTS.map((d) => ({ ...d }));
for (const d of DEFAULTS) if (!standards.find((s) => s.id === d.id)) standards.push({ ...d });

const S = {
  via: store.get('cutter.via', 'ble'),
  standards,
  presetId: store.get('cutter.preset.v2', 'bookbinding'),
  work: null,             // working copy of the selected standard
  design: null,           // { name, paths (normalised to 0,0), w, h, warnings }
  pos: [10, 10],
  link: null, cutter: null, busy: false, stop: false,
};
if (!S.standards.find((p) => p.id === S.presetId)) S.presetId = S.standards[0].id;
const standard = () => S.standards.find((p) => p.id === S.presetId);
const pick = (o) => Object.fromEntries(FIELDS.map((f) => [f, o[f]]));
S.work = pick(standard());
const changed = () => FIELDS.filter((f) => String(S.work[f]) !== String(standard()[f]));

const logEl = $('log');
function log(msg) {
  const t = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  logEl.textContent += `${t}  ${msg}\n`;
  logEl.scrollTop = logEl.scrollHeight;
}
function dock(msg, kind = '') { const d = $('dockMsg'); d.textContent = msg; d.className = 'msg ' + kind; }

// ------------------------------------------------------------- transports
async function connectBle() {
  if (!navigator.bluetooth) throw new Error("This browser can't use Bluetooth. Open the page in Chrome on Android.");
  const device = await navigator.bluetooth.requestDevice({
    filters: [{ services: [BLE.SERVICE] }, { namePrefix: 'CAMEO' }, { namePrefix: 'Cameo' }],
    optionalServices: [BLE.SERVICE],
  });
  log(`Picked ${device.name || 'a device'}`);
  const gatt = await device.gatt.connect();
  const svc = await gatt.getPrimaryService(BLE.SERVICE);
  const [w, r, c] = await Promise.all([BLE.WRITE, BLE.READ, BLE.CONTROL].map((u) => svc.getCharacteristic(u)));
  const link = new Link();
  r.addEventListener('characteristicvaluechanged', (e) => {
    const v = e.target.value; link.push(new Uint8Array(v.buffer, v.byteOffset, v.byteLength));
  });
  await c.startNotifications();
  await r.startNotifications();
  for (const ch of [c, r, w]) await ch.writeValueWithResponse(Uint8Array.from(BLE.INIT));
  await sleep(1000);
  link.clear();
  let queue = Promise.resolve();
  const writeChunk = async (chunk) => {
    for (let attempt = 0; ; attempt++) {
      try { return await w.writeValueWithResponse(chunk); }
      catch (e) { if (attempt >= 3 || !gatt.connected) throw e; await sleep(100 * 2 ** attempt); }
    }
  };
  const t = {
    kind: 'Bluetooth', name: device.name || '', link,
    write(bytes) {
      queue = queue.then(async () => { for (let o = 0; o < bytes.length; o += BLE.CHUNK) await writeChunk(bytes.slice(o, o + BLE.CHUNK)); });
      return queue;
    },
    close() { try { gatt.disconnect(); } catch {} },
  };
  device.addEventListener('gattserverdisconnected', () => { link.closed = true; onLost(t); });
  return t;
}

async function connectUsb() {
  if (!navigator.usb) throw new Error("This browser can't use the USB cable. Open the page in Chrome on Android.");
  const device = await navigator.usb.requestDevice({ filters: USB.VENDORS.map((vendorId) => ({ vendorId })) });
  await device.open();
  if (device.configuration === null) await device.selectConfiguration(1);
  const iface = device.configuration.interfaces.find((i) => i.alternate.endpoints.some((e) => e.type === 'bulk'));
  if (!iface) throw new Error('The cutter did not offer a data connection');
  await device.claimInterface(iface.interfaceNumber);
  const eps = iface.alternate.endpoints;
  const out = (eps.find((e) => e.type === 'bulk' && e.direction === 'out') || { endpointNumber: USB.WRITE_EP }).endpointNumber;
  const inn = (eps.find((e) => e.type === 'bulk' && e.direction === 'in') || { endpointNumber: USB.READ_EP }).endpointNumber;
  const link = new Link();
  (async () => {
    while (!link.closed) {
      try {
        const r = await device.transferIn(inn, 64);
        if (r.data && r.data.byteLength) link.push(new Uint8Array(r.data.buffer, r.data.byteOffset, r.data.byteLength));
      } catch { link.closed = true; }
    }
  })();
  let queue = Promise.resolve();
  const t = {
    kind: 'USB cable', name: device.productName || '', link, usb: [device.vendorId, device.productId],
    write(bytes) {
      queue = queue.then(async () => { for (let o = 0; o < bytes.length; o += 4096) await device.transferOut(out, bytes.slice(o, o + 4096)); });
      return queue;
    },
    close() { link.closed = true; device.close().catch(() => {}); },
  };
  navigator.usb.addEventListener('disconnect', (e) => { if (e.device === device) { link.closed = true; onLost(t); } });
  return t;
}

function onLost(t) {
  if (S.link !== t) return;
  S.link = null; S.cutter = null;
  log('Connection lost');
  setConn();
  if (!S.busy) dock('Cutter disconnected', 'bad');
}

async function connect() {
  if (S.link) { S.link.close(); S.link = null; S.cutter = null; setConn(); return; }
  $('connNote').className = 'note';
  setConn('busy', 'Connecting…');
  try {
    const t = S.via === 'usb' ? await connectUsb() : await connectBle();
    const cutter = new Cutter(t, log);
    cutter.hw = t.usb ? hardwareFromUsb(...t.usb) : hardwareFromName(t.name);
    const fw = await cutter.identify();
    if (!cutter.hw) cutter.hw = { key: 'cameo5', ...HARDWARE.cameo5 };
    log(`Connected over ${t.kind}: ${cutter.hw.name}${fw ? ` (firmware ${fw.trim()})` : ''}`);
    S.link = t; S.cutter = cutter;
    const st = await cutter.status();
    log(`Status: ${st}`);
    setConn();
    dock(st === 'unloaded' ? 'Connected. Load the mat.' : 'Ready to cut', 'good');
  } catch (e) {
    setConn();
    const name = e && e.name;
    let msg = e && e.message ? e.message : String(e);
    if (name === 'NotFoundError') {
      msg = S.via === 'usb'
        ? 'No cutter picked. If the Cameo never appears in the list, the cable is probably charge-only or the phone needs a USB-C OTG adapter.'
        : 'No cutter picked. Check the Cameo is on, Bluetooth is on, and Silhouette Studio or Go is closed everywhere.';
    } else if (name === 'SecurityError') {
      msg = 'This page is not allowed to use Bluetooth or USB here. Open it from its own web address in Chrome.';
    } else if (name === 'NetworkError') {
      msg = 'The cutter refused the connection. Turn it off and on, then try again.';
    }
    $('connNote').textContent = msg;
    $('connNote').className = 'note bad';
    log('Connect failed: ' + (e && (e.name + ': ' + e.message)));
  }
}

function setConn(state, text) {
  $('dot').className = 'dot' + (state === 'busy' ? ' busy' : S.link ? ' on' : '');
  $('connText').textContent = text || (S.link ? `${S.cutter?.hw?.name || 'Cutter'} · ${S.link.kind}` : 'Not connected');
  $('connectBtn').textContent = S.link ? 'Disconnect' : 'Connect';
  $('connectBtn').className = S.link ? '' : 'primary';
  $('connectRow').hidden = !!S.link;
  updateCut();
}

// ------------------------------------------------------------- design
function loadSvgText(text, name) {
  const doc = new DOMParser().parseFromString(text, 'image/svg+xml');
  if (doc.querySelector('parsererror')) throw new Error('That file is not a readable SVG');
  const res = svgToPaths(doc);
  if (!res.paths.length) throw new Error(res.warnings[0] || 'No cut lines found in that file');
  const b = bboxOf(res.paths);
  S.design = { name, paths: translatePaths(res.paths, -b.x0, -b.y0), w: b.w, h: b.h, warnings: res.warnings };
  S.pos = [Math.max(10, round1(b.x0)), Math.max(10, round1(b.y0))];
  log(`Loaded ${name}: ${res.paths.length} lines, ${b.w.toFixed(1)} × ${b.h.toFixed(1)} mm`);
  renderAll();
}
const round1 = (v) => Math.round(v * 10) / 10;

function testDesign() {
  // 25 mm square with a triangle inside, the usual test-cut shape
  const sq = [[0, 0], [25, 0], [25, 25], [0, 25], [0, 0]];
  const tri = [[12.5, 5], [20, 19], [5, 19], [12.5, 5]];
  S.design = { name: 'Test square', paths: [sq, tri], w: 25, h: 25, warnings: [] };
  S.pos = [10, 10];
  renderAll();
}

function jobPaths() {
  if (!S.design) return [];
  let p = orderPaths(translatePaths(S.design.paths, S.pos[0], S.pos[1]));
  const n = Math.max(1, Math.min(5, S.work.passes | 0));
  if (n > 1) p = Array.from({ length: n }, () => p).flat();
  return p;
}

function matSize() {
  const m = MATS[S.work.mat];
  if (m && m.w) return [m.w * 25.4, m.h * 25.4];
  const hw = S.cutter?.hw || HARDWARE.cameo5;
  const h = S.design ? Math.max(304.8, S.pos[1] + S.design.h + 20) : 304.8;
  return [hw.width, h];
}

const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent && parent.appendChild(e);
  return e;
}

function renderMat() {
  const svg = $('matSvg');
  const [W, H] = matSize();
  const M = 14, R = 6; // mat border with the ruler numbers, like the real mat
  svg.setAttribute('viewBox', `${-M} ${-M} ${W + M + 6} ${H + M + 6}`);
  svg.replaceChildren();
  el('rect', { class: 'bed', x: -M, y: -M, width: W + M + 6, height: H + M + 6, rx: R }, svg);
  const inch = 25.4;
  for (let i = 0; i * inch / 2 <= W + 0.1; i++) el('line', { class: 'grid' + (i % 2 ? '' : ' major'), x1: i * inch / 2, y1: 0, x2: i * inch / 2, y2: H }, svg);
  for (let i = 0; i * inch / 2 <= H + 0.1; i++) el('line', { class: 'grid' + (i % 2 ? '' : ' major'), x1: 0, y1: i * inch / 2, x2: W, y2: i * inch / 2 }, svg);
  el('rect', { class: 'edge', x: 0, y: 0, width: W, height: H }, svg);
  for (let i = 1; i * inch <= W + 0.1; i++) { const t = el('text', { class: 'ruler', x: i * inch, y: -5, 'text-anchor': 'middle' }, svg); t.textContent = i; }
  for (let i = 1; i * inch <= H + 0.1; i++) { const t = el('text', { class: 'ruler', x: -5, y: i * inch + 2.2, 'text-anchor': 'end' }, svg); t.textContent = i; }
  $('matName').textContent = MATS[S.work.mat]?.w ? `${MATS[S.work.mat].w} × ${MATS[S.work.mat].h} in mat` : 'No mat';
  if (!S.design) {
    const t = el('text', { class: 'empty', x: W / 2, y: H / 2, 'text-anchor': 'middle' }, svg);
    t.textContent = 'Open an SVG or tap Test square';
    return;
  }
  const g = el('g', { class: 'cut' }, svg);
  for (const p of translatePaths(S.design.paths, S.pos[0], S.pos[1])) {
    el('polyline', { points: p.map(([x, y]) => `${x.toFixed(2)},${y.toFixed(2)}`).join(' ') }, g);
  }
  const first = jobPaths()[0];
  if (first) el('circle', { class: 'start', cx: first[0][0], cy: first[0][1], r: 1.8 }, svg);
}

function renderMeta() {
  const m = $('meta'), w = $('warns');
  m.replaceChildren(); w.replaceChildren();
  if (!S.design) return;
  const d = S.design;
  const add = (label, value) => { const s = document.createElement('span'); s.append(label ? label + ' ' : ''); const b = document.createElement('b'); b.textContent = value; s.append(b); m.appendChild(s); };
  add('', d.name);
  add('Size', `${d.w.toFixed(1)} × ${d.h.toFixed(1)} mm`);
  add('Lines', String(d.paths.length));
  const [W, H] = matSize();
  const warn = [...d.warnings];
  if (S.pos[0] + d.w > W + 0.05 || S.pos[1] + d.h > H + 0.05) warn.push('Part of the design is off the mat. Move it or pick a bigger mat; the cutter will skip that part.');
  for (const t of warn) { const p = document.createElement('p'); p.textContent = t; w.appendChild(p); }
}

function renderPresets() {
  const tabs = $('presetTabs');
  tabs.replaceChildren();
  for (const p of S.standards) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'tab'; b.setAttribute('role', 'tab'); b.textContent = p.name;
    b.setAttribute('aria-selected', String(p.id === S.presetId));
    // one touch: picking a material (even the current one) restores its standard
    b.onclick = () => { S.presetId = p.id; store.set('cutter.preset.v2', p.id); S.work = pick(p); renderAll(); };
    tabs.appendChild(b);
  }
  renderFields();
}

function renderFields() {
  for (const f of FIELDS) $(f).value = String(S.work[f]);
  $('depthField').hidden = S.work.tool !== 'autoblade';
  const diff = changed();
  document.querySelectorAll('.field[data-f]').forEach((n) => n.classList.toggle('changed', diff.includes(n.dataset.f)));
  const box = $('std'), st = standard();
  box.replaceChildren();
  box.className = 'std' + (diff.length ? ' dirty' : '');
  const txt = document.createElement('div'); txt.className = 'txt';
  const btns = document.createElement('div'); btns.className = 'btns';
  const mk = (label, fn) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'link'; b.textContent = label; b.onclick = fn; btns.append(b); };
  if (diff.length) {
    txt.append('Changed for this cut: ', ...diff.flatMap((f, i) => {
      const b = document.createElement('b'); b.textContent = `${LABEL[f]} ${show(f, S.work[f])}`;
      return i ? [', ', b] : [b];
    }));
    mk('Back to standard', () => { S.work = pick(st); renderFields(); renderMat(); renderMeta(); });
    mk('Save as standard', () => { Object.assign(st, S.work, { confirmed: true }); store.set(STD_KEY, S.standards); renderFields(); log(`Saved ${st.name} standard`); });
  } else if (st.confirmed === false) {
    txt.append(`These ${st.name.toLowerCase()} numbers are placeholders. Set yours, then tap `, Object.assign(document.createElement('b'), { textContent: 'Save as standard' }), '.');
    mk('Save as standard', () => { st.confirmed = true; store.set(STD_KEY, S.standards); renderFields(); log(`Saved ${st.name} standard`); });
  } else {
    txt.append('Using your ', Object.assign(document.createElement('b'), { textContent: `${st.name} standard` }), '. Tap the tab any time to get it back.');
  }
  box.append(txt, btns);
}

function renderAll() {
  $('posX').value = S.pos[0]; $('posY').value = S.pos[1];
  renderPresets(); renderMat(); renderMeta(); updateCut();
}

function updateCut() {
  const b = $('cutBtn');
  if (S.busy) { b.textContent = 'Stop'; b.disabled = false; return; }
  b.textContent = 'Cut';
  b.disabled = !(S.design && S.cutter);
  if (S.design && !S.cutter && !$('dockMsg').classList.contains('bad')) dock('Connect the cutter to cut');
  if (!S.design && S.cutter) dock('Load a design to start');
}

// ------------------------------------------------------------- cut
async function cut() {
  if (S.busy) { S.stop = true; dock('Stopping after this section…'); return; }
  const w = S.work, st = standard();
  const settings = {
    mat: w.mat, tool: w.tool, pressure: +w.force, speed: +w.speed,
    depth: w.tool === 'autoblade' ? +w.depth : null, toolholder: +w.holder,
  };
  const paths = jobPaths();
  S.busy = true; S.stop = false; updateCut();
  $('bar').hidden = false;
  $('barFill').style.width = '0%';
  dock(`Cutting ${S.design.name}…`);
  let lock = null;
  try { lock = await navigator.wakeLock?.request('screen'); } catch {}
  log(`Cut: ${st.name}${changed().length ? ' (changed)' : ''}, ${show('tool', w.tool)}${settings.depth != null ? ` depth ${settings.depth}` : ''}, force ${settings.pressure}, speed ${settings.speed}, ${w.passes} pass(es), ${paths.length} lines`);
  try {
    const res = await S.cutter.run(
      { paths, settings, mediaHeight: matSize()[1] },
      {
        onProgress: (f) => { $('barFill').style.width = `${Math.round(f * 100)}%`; dock(`Cutting ${S.design.name}… ${Math.round(f * 100)}%`); },
        shouldStop: () => S.stop,
      },
    );
    if (res.clipped) log(`${res.clipped} points were outside the cutting area and skipped`);
    dock(S.stop ? 'Stopped. Press the unload button on the Cameo.' : 'Done. Press the unload button on the Cameo.', S.stop ? '' : 'good');
    $('barFill').style.width = '100%';
  } catch (e) {
    log('Cut failed: ' + e.message);
    dock(e.message, 'bad');
  } finally {
    try { await lock?.release(); } catch {}
    S.busy = false; updateCut();
  }
}

// ------------------------------------------------------------- wiring
function setVia(v) {
  S.via = v; store.set('cutter.via', v);
  $('viaBle').setAttribute('aria-selected', String(v === 'ble'));
  $('viaUsb').setAttribute('aria-selected', String(v === 'usb'));
  $('connNote').className = 'note';
  $('connNote').textContent = v === 'usb'
    ? 'Plug the cable into the Cameo and your phone, turn the Cameo on, then tap Connect.'
    : 'Turn the Cameo on and close Silhouette Studio or Silhouette Go on any device, then tap Connect.';
}
$('viaBle').onclick = () => setVia('ble');
$('viaUsb').onclick = () => setVia('usb');
$('connectBtn').onclick = connect;
$('cutBtn').onclick = cut;
$('openBtn').onclick = () => $('file').click();
$('testBtn').onclick = testDesign;
$('file').onchange = async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  try { loadSvgText(await f.text(), f.name.replace(/\.svg$/i, '')); }
  catch (err) { dock(err.message, 'bad'); log('Open failed: ' + err.message); }
  e.target.value = '';
};
for (const id of ['posX', 'posY']) $(id).oninput = () => {
  const v = parseFloat($(id).value);
  if (!Number.isFinite(v)) return;
  S.pos[id === 'posX' ? 0 : 1] = Math.max(0, v);
  renderMat(); renderMeta();
};
const LIMITS = { depth: [0, 10], force: [1, 33], speed: [1, 30], passes: [1, 5] };
function setNum(k, v) {
  const [lo, hi] = LIMITS[k];
  S.work[k] = Math.max(lo, Math.min(hi, Math.round(v)));
  renderFields();
  if (k === 'passes') renderMat();
}
for (const k of Object.keys(LIMITS)) $(k).onchange = () => setNum(k, parseFloat($(k).value) || 0);
document.querySelectorAll('[data-step]').forEach((b) => b.onclick = () => {
  const [k, d] = b.dataset.step.split(',');
  setNum(k, (+S.work[k] || 0) + +d);
});
$('tool').onchange = () => { S.work.tool = $('tool').value; renderFields(); };
$('holder').onchange = () => { S.work.holder = +$('holder').value; renderFields(); };
$('mat').onchange = () => { S.work.mat = $('mat').value; renderFields(); renderMat(); renderMeta(); };

// open a design passed in the address: ?svg=<url>
(async () => {
  const u = new URLSearchParams(location.search).get('svg');
  if (!u) return;
  try {
    const r = await fetch(u);
    loadSvgText(await r.text(), decodeURIComponent(u.split('/').pop().replace(/\.svg.*$/i, '')) || 'Design');
  } catch (e) { log('Could not load design from link: ' + e.message); }
})();

setVia(S.via);
setConn();
testDesign();
dock('Connect the cutter to cut');
</script>
